<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting – StudyVault</title>
    <script>
      (function () {
        var repoBase = '/DSSSB-/';
        var path = window.location.pathname;
        var relative = path.indexOf(repoBase) === 0 ? path.slice(repoBase.length) : path.replace(/^\/+/, '');
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var target = repoBase + '#/' + relative.replace(/^\/+/, '') + search + (hash && hash !== '#/' ? '' : '');
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to StudyVault...</p>
  </body>
</html>
